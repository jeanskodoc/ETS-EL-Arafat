<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ETS EL Arafat · Accueil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif}

        body{
            min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:16px;
            position:relative;overflow-x:hidden;
            background:url('E2.jpeg') center/cover no-repeat fixed;
        }
        body::before{
            content:'';position:fixed;inset:0;z-index:0;
            background:rgba(0,0,0,.6);
        }

        .card{
            position:relative;z-index:2;
            width:100%;max-width:400px;
            padding:clamp(30px,5vw,42px) clamp(24px,4vw,34px);
            background:rgba(255,255,255,.04);
            backdrop-filter:blur(26px) saturate(1.7);
            -webkit-backdrop-filter:blur(26px) saturate(1.7);
            border-radius:26px;
            border:1px solid rgba(255,255,255,.08);
            box-shadow:0 24px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
            text-align:center;
        }

        .card>*{
            animation:reveal .65s cubic-bezier(.22,1,.36,1) both;
        }
        .card>*:nth-child(1){animation-delay:.05s}
        .card>*:nth-child(2){animation-delay:.15s}
        .card>*:nth-child(3){animation-delay:.25s}
        .card>*:nth-child(4){animation-delay:.38s}
        .card>*:nth-child(5){animation-delay:.52s}
        @keyframes reveal{
            0%{opacity:0;transform:translateY(18px) scale(.97)}
            100%{opacity:1;transform:translateY(0) scale(1)}
        }

        .logo{
            width:clamp(80px,17vw,100px);height:clamp(80px,17vw,100px);
            margin:0 auto clamp(18px,3vw,24px);
            position:relative;display:flex;align-items:center;justify-content:center;
            border-radius:50%;
            background:linear-gradient(135deg,#10b981,#047857);
            box-shadow:0 8px 32px rgba(16,185,129,.35);
            transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s;
        }
        .logo:hover{transform:scale(1.06);box-shadow:0 12px 48px rgba(16,185,129,.5)}
        .logo::after{
            content:'';position:absolute;inset:-3px;border-radius:50%;
            border:1.5px solid rgba(255,255,255,.1);
        }
        .logo img{
            width:60%;height:60%;object-fit:cover;border-radius:50%;
            filter:drop-shadow(0 2px 8px rgba(0,0,0,.35));
        }

        h1{
            color:#fff;
            font-size:clamp(1.4rem,5vw,1.8rem);
            font-weight:800;letter-spacing:-.02em;
            margin-bottom:4px;
        }
        h1 span{color:#34d399}

        .badge{
            display:inline-flex;align-items:center;gap:6px;
            padding:5px 14px;margin-bottom:clamp(16px,3vw,22px);
            background:rgba(255,255,255,.06);border-radius:20px;
            border:1px solid rgba(255,255,255,.08);
            color:rgba(255,255,255,.5);
            font-size:clamp(.6rem,1.4vw,.68rem);
            font-weight:500;letter-spacing:.04em;
        }
        .badge i{font-size:.5rem;color:#34d399}

        p.sub{
            color:rgba(255,255,255,.4);
            font-size:clamp(.7rem,2vw,.8rem);
            font-weight:500;letter-spacing:.08em;text-transform:uppercase;
            margin-bottom:clamp(28px,5vw,36px);
        }

        .btns{display:flex;flex-direction:column;gap:13px}

        .btn{
            display:flex;align-items:center;gap:16px;
            padding:clamp(14px,3vw,18px) clamp(18px,4vw,22px);
            border-radius:16px;text-decoration:none;
            transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .35s,background .35s;
            position:relative;overflow:hidden;
            cursor:pointer;
        }
        .btn:active{transform:scale(.96)}

        .btn-shop{
            background:linear-gradient(135deg,#10b981,#047857);
            color:#fff;
            box-shadow:0 6px 24px rgba(16,185,129,.3);
        }
        .btn-shop:hover{
            box-shadow:0 12px 44px rgba(16,185,129,.45);
            transform:translateY(-3px) scale(1.01);
        }
        .btn-shop::before{
            content:'';position:absolute;inset:0;border-radius:inherit;
            background:linear-gradient(135deg,rgba(255,255,255,.1),transparent 60%);
            pointer-events:none;opacity:0;
            transition:opacity .35s;
        }
        .btn-shop:hover::before{opacity:1}

        .btn-buy{
            background:rgba(255,255,255,.05);
            color:#fff;
            border:1px solid rgba(255,255,255,.1);
        }
        .btn-buy:hover{
            background:rgba(255,255,255,.1);
            border-color:rgba(255,255,255,.2);
            transform:translateY(-3px) scale(1.01);
            box-shadow:0 12px 40px rgba(0,0,0,.3);
        }

        .btn-icon{
            width:clamp(46px,10vw,54px);height:clamp(46px,10vw,54px);
            border-radius:14px;display:flex;align-items:center;justify-content:center;
            font-size:clamp(1.1rem,3vw,1.4rem);flex-shrink:0;
            position:relative;
        }
        .btn-icon::after{
            content:'';position:absolute;inset:0;border-radius:inherit;
            background:linear-gradient(135deg,rgba(255,255,255,.1),transparent 50%);
            pointer-events:none;
        }
        .btn-shop .btn-icon{background:rgba(255,255,255,.12)}
        .btn-buy .btn-icon{background:rgba(255,255,255,.06)}
        .btn-text{flex:1;text-align:left}
        .btn-text .title{
            font-size:clamp(.88rem,2.2vw,1rem);font-weight:700;display:block;
        }
        .btn-text .desc{
            font-size:clamp(.63rem,1.6vw,.73rem);opacity:.5;display:block;margin-top:3px;
            font-weight:400;
        }

        .btn-arrow{
            font-size:clamp(.95rem,2.5vw,1.15rem);
            opacity:.35;transition:all .35s cubic-bezier(.22,1,.36,1);
        }
        .btn:hover .btn-arrow{opacity:1;transform:translateX(6px)}

        .btn-shop::after{
            content:'';position:absolute;inset:-2px;border-radius:inherit;
            background:linear-gradient(135deg,#10b981,#f72585);
            z-index:-1;opacity:0;filter:blur(12px);
            transition:opacity .45s;
        }
        .btn-shop:hover::after{opacity:.5}

        footer{
            margin-top:clamp(24px,4vw,32px);
            color:rgba(255,255,255,.18);
            font-size:clamp(.6rem,1.5vw,.7rem);
            line-height:1.6;
        }
        footer a{
            color:rgba(250,204,21,.55);text-decoration:none;
            transition:color .3s;
            font-weight:500;
        }
        footer a:hover{color:#facc15}

        @media(max-width:420px){
            .card{padding:24px 18px;border-radius:20px}
            .logo{width:68px;height:68px;margin-bottom:14px}
            .btn{gap:12px;padding:12px 14px;border-radius:14px}
            .btn-icon{width:40px;height:40px;border-radius:12px;font-size:.95rem}
        }

        @media(max-height:520px)and(orientation:landscape){
            .card{max-width:94%;padding:14px 20px}
            .logo{width:44px;height:44px;margin-bottom:6px}
            .logo img{width:55%;height:55%}
            .badge{display:none}
            h1{font-size:.9rem}
            p.sub{font-size:.55rem;margin-bottom:10px}
            .btns{flex-direction:row;gap:10px}
            .btn{padding:8px 12px;border-radius:12px}
            .btn-icon{width:32px;height:32px;border-radius:10px;font-size:.75rem}
            footer{margin-top:8px;font-size:.5rem}
        }

        @media(prefers-reduced-motion:reduce){
            .card>*{animation:none;opacity:1;transform:none}
            .btn,.btn::after,.btn-arrow{transition:none}
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><img src="E1.jpeg" alt="EL Arafat"></div>
        <h1>ETS-<span>EL Arafat</span></h1>
        <div class="badge"><i class="fas fa-circle"></i> Boutique en ligne</div>
        <p class="sub">GESTION · VENTE EN LIGNE · FACTURES</p>

        <div class="btns">
            <a href="B.html" class="btn btn-shop">
                <div class="btn-icon"><i class="fas fa-store-alt"></i></div>
                <div class="btn-text">
                    <span class="title">Boutique EL Arafat</span>
                    <span class="desc">Interface Vente physique</span>
                </div>
                <span class="btn-arrow"><i class="fas fa-chevron-right"></i></span>
            </a>
            <a href="compta-auto.html" class="btn btn-buy">
                <div class="btn-icon"><i class="fas fa-file-invoice"></i></div>
                <div class="btn-text">
                    <span class="title">Comptabilité</span>
                    <span class="desc">Gestion des comptes</span>
                </div>
                <span class="btn-arrow"><i class="fas fa-chevron-right"></i></span>
            </a>
        </div>

        <footer>
            <p>&copy; 2026 &middot; <a href="tel:92871605">92 87 16 05</a></p>
        </footer>
    </div>
</body>
</html>
